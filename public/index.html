<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA: installable, standalone, dark-themed to match the app (see src/design/theme.ts).
         Expo injects <meta name="theme-color"> itself from app.json's web.themeColor. -->
    <link rel="manifest" href="./manifest.json" />

    <!-- iOS ignores manifest.json for "Add to Home Screen" — it needs its own tags to
         launch fullscreen (no Safari chrome) with an icon and a title. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jinote" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="./icons/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />

    <!-- Offline after the first visit — see public/sw.js for exactly what it caches
         and why it's deliberately simple. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((error) => {
            console.warn('Service worker registration failed', error);
          });
        });
      }
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Matches src/design/theme.ts's `background`, so there's no white flash
           before the app mounts or in the letterboxed margins on wide screens. */
        background-color: #F4EEE2;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
